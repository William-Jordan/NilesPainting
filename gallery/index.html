<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Niles Painting</title>
    <link rel="icon" type="image/x-icon" href="../images/icon.webp">
    <style>
        @font-face {
            font-family: 'Fvriosa';
            src: url('../fonts/Fvriosa.ttf') format('truetype');
        }
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fff;
            color: #333;
        }
        header {
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1200px;
            margin: 0 auto;
        }
        .logo-small {
            height: 50px;
        }
        .back-link {
            text-decoration: none;
            color: #333;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        h1 {
            font-family: 'Fvriosa', sans-serif;
            color: #E97824;
            text-align: center;
            margin: 40px 0;
            font-size: 2.5rem;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(500px, 1fr));
            gap: 15px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .gallery-item {
            aspect-ratio: 1 / 1;
            overflow: hidden;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        .gallery-item:hover {
            transform: scale(1.02);
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Modal / Carousel Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            position: relative;
            max-width: 90%;
            max-height: 80%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .modal-content img {
            max-width: 100%;
            max-height: 100vh;
            object-fit: contain;
            user-select: none;
        }
        .close-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            z-index: 1020;
            line-height: 1;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 15px;
            cursor: pointer;
            font-size: 24px;
            border-radius: 50%;
            transition: background 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            z-index: 1010;
        }
        .nav-btn:hover {
            background: rgba(0, 0, 0, 0.8);
        }
        .prev-btn { left: 20px; }
        .next-btn { right: 20px; }

        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .nav-btn {
                width: 50px;
                height: 50px;
                padding: 10px;
                background: rgba(0, 0, 0, 0.3);
            }
            .prev-btn { left: 10px; }
            .next-btn { right: 10px; }
            .close-btn { top: 20px; right: 20px; }
            .modal-content { 
                max-width: 100%;
                width: 100%;
                height: 100%;
            }
            .modal-content img {
                max-height: 90vh;
            }
            .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
        }
    </style>
</head>
<body>
    <header>
        <a href="../" class="back-link">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back to Home
        </a>
        <img src="../images/logoT.webp" alt="Niles Painting Logo" class="logo-small">
    </header>

    <h1>Gallery</h1>

    <div class="gallery-grid" id="galleryGrid">
        <!-- Images will be added here -->
        <div class="gallery-item" onclick="openModal(0)"><img src="photos/G1.jpg" alt="Painting work 1"></div>
        <div class="gallery-item" onclick="openModal(1)"><img src="photos/G2.jpg" alt="Painting work 2"></div>
        <div class="gallery-item" onclick="openModal(2)"><img src="photos/G3.jpg" alt="Painting work 3"></div>
        <div class="gallery-item" onclick="openModal(3)"><img src="photos/G4.jpg" alt="Painting work 4"></div>
        <div class="gallery-item" onclick="openModal(4)"><img src="photos/G5.jpg" alt="Painting work 5"></div>
        <div class="gallery-item" onclick="openModal(5)"><img src="photos/G6.jpg" alt="Painting work 6"></div>
        <div class="gallery-item" onclick="openModal(6)"><img src="photos/G7.jpg" alt="Painting work 7"></div>
        <div class="gallery-item" onclick="openModal(7)"><img src="photos/G8.jpg" alt="Painting work 8"></div>
    </div>

    <div id="imageModal" class="modal">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <div class="modal-content">
            <button class="nav-btn prev-btn" onclick="changeImage(-1)">&#10094;</button>
            <img id="modalImage" src="" alt="Full size image">
            <button class="nav-btn next-btn" onclick="changeImage(1)">&#10095;</button>
        </div>
    </div>

    <script>
        const images = [
            'photos/G1.jpg',
            'photos/G2.jpg',
            'photos/G3.jpg',
            'photos/G4.jpg',
            'photos/G5.jpg',
            'photos/G6.jpg',
            'photos/G7.jpg',
            'photos/G8.jpg'
        ];
        let currentIndex = 0;

        function openModal(index) {
            currentIndex = index;
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImage');
            modal.style.display = 'flex';
            modalImg.src = images[currentIndex];
            document.body.style.overflow = 'hidden'; // Prevent scrolling
        }

        function closeModal() {
            document.getElementById('imageModal').style.display = 'none';
            document.body.style.overflow = 'auto'; // Restore scrolling
        }

        function changeImage(step) {
            currentIndex = (currentIndex + step + images.length) % images.length;
            document.getElementById('modalImage').src = images[currentIndex];
        }

        // Close modal when clicking outside the image
        window.onclick = function(event) {
            const modal = document.getElementById('imageModal');
            if (event.target === modal) {
                closeModal();
            }
        }

        // Keyboard navigation
        document.addEventListener('keydown', function(event) {
            const modal = document.getElementById('imageModal');
            if (modal.style.display === 'flex') {
                if (event.key === 'ArrowLeft') {
                    changeImage(-1);
                } else if (event.key === 'ArrowRight') {
                    changeImage(1);
                } else if (event.key === 'Escape') {
                    closeModal();
                }
            }
        });
    </script>
</body>
</html>
